api:
  host: ""
  joinToken: ""

cluster:
  name: ""

image:
  repository: registry.eclipse.org/eclipse-research-labs/enact-project/telemetry-data-collector-and-monitoring-engine
  tag: main-agent
  pullPolicy: Always


serviceAccount:
  create: true
  name: monitor-api-agent-sa

  
agent:
  syncInterval: 30
  prometheusHost: "" 

resources: 
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "250m"
    memory: "128Mi"
