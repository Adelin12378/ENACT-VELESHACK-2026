replicaCount: 1

image:
  repository: registry.eclipse.org/eclipse-research-labs/enact-project/telemetry-data-collector-and-monitoring-engine
  tag: main-infra
  pullPolicy: Always



service:
  type: NodePort
  port: 80
  nodePort: 32554

    
env:
  EDC_API_URL: ""

# EDC API key secret configuration (assumes secret is preinstalled in the cluster)
edc:
  existingSecret: ""
  secretKey: ""
  
api:
  joinToken: ""
  adminToken: ""

prometheus:
  # Webhook URL for Alertmanager. If left empty, it automatically defaults to:
  # http://<chart-name>-service.<namespace>.svc.cluster.local:<service-port>/webhook
  url: ""

resources: 
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  name: monitor-api-sa
