# Default values for greencharge.
# This is a YAML-formatted file.

replicaCount: 1

image:
  # replace ghcr.io/thanasislt/enact-veleshack-2026/greencharge:latest with your ghcr.io image
  repository: ghcr.io/thanasislt/enact-veleshack-2026/greencharge
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "sha-e7b1463"

# create your secret with the following command:
# kubectl create secret ghcr --docker-server=<ghcr.io/XXXX> --docker-username=<USERNAME> --docker-password=<GITHUB_TOKEN> --docker-email=<EMAIL>
imagePullSecrets: 
  - name: ghcr
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: NodePort
  port: 8080
  # do not edit the nodePort. Kind is configured to NAT to this nodePort.
  nodePort: 32585

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: greencharge.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  - name: APP_OPEN_BROWSER
    value: "false"

nodeSelector: {}
tolerations: []
affinity: {}
